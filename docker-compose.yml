x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: bingoscape-postgres
    hostname: ${DB_HOST:-bingoscapedb}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-bingoscape}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - bingoscape-network

  # Next.js Application
  app:
    image: ghcr.io/bingoscape/bingoscape:${IMAGE_TAG:-main}
    container_name: bingoscape-app
    restart: unless-stopped
    user: "1001:1001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/uptime || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      # Database Configuration
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@${DB_HOST:-bingoscapedb}:5432/${DB_NAME:-bingoscape}

      # NextAuth Configuration
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}

      # OAuth Providers
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      # Application Configuration
      # No default: an unset list means nobody is a super admin (never fall back to a guessable address)
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
      NODE_ENV: production
      CRON_SECRET: ${CRON_SECRET:-}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}

      # Skip environment validation in container
      SKIP_ENV_VALIDATION: "1"
    # Bound to localhost only: the host nginx proxies to it
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Mount uploads directory from host system
      # Update the path on the left side to your desired host directory
      - ./uploads:/app/public/uploads:rw
    logging: *default-logging
    networks:
      - bingoscape-network

  # Database migrations (run on demand: docker compose run --rm migrate)
  migrate:
    image: ghcr.io/bingoscape/bingoscape-migrator:${IMAGE_TAG:-main}
    container_name: bingoscape-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@${DB_HOST:-bingoscapedb}:5432/${DB_NAME:-bingoscape}
    networks:
      - bingoscape-network
    profiles:
      - tools # Only run when explicitly specified

volumes:
  postgres_data:
    driver: local

networks:
  bingoscape-network:
    driver: bridge
