name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy: main (latest main build), sha-<short> (one specific commit) or a release tag such as v1.2.3"
        required: true
        default: "main"
        type: string

# Never run two deploys at once, and never cancel one halfway through
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Secrets are passed through `env:` and never interpolated into script text,
      # so quotes, $, # and backslashes in values are safe. The file is written
      # on the runner and uploaded over SCP; it is never printed.
      - name: Render .env from secrets
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          # GITHUB_* secret names are reserved by GitHub, hence the GH_OAUTH_* names.
          # They are written to the .env under the names the app expects.
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SUPER_ADMIN_EMAILS: ${{ secrets.SUPER_ADMIN_EMAILS }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RBAC_READ_POLICY: ${{ secrets.RBAC_READ_POLICY }}
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid image_tag. Allowed: letters, digits, '_', '.', '-' (max 128 chars)."
            exit 1
          fi

          umask 077
          out=deploy.env
          : > "$out"

          # Quote for docker compose env-file syntax: double quotes, escaping \ " and $
          quote() {
            local v="$1"
            v="${v//\\/\\\\}"
            v="${v//\"/\\\"}"
            v="${v//\$/\\\$}"
            printf '"%s"' "$v"
          }
          # emit <variable name> <value> [required]
          emit() {
            if [ -z "$2" ]; then
              if [ "${3:-}" = "required" ]; then
                echo "::error::Required secret for $1 is not set."
                exit 1
              fi
              return 0
            fi
            if [[ "$2" == *$'\n'* || "$2" == *$'\r'* ]]; then
              echo "::error::The value for $1 contains a line break, which a .env value cannot hold."
              exit 1
            fi
            printf '%s=%s\n' "$1" "$(quote "$2")" >> "$out"
          }

          echo "# Generated by GitHub Actions run ${GITHUB_RUN_ID} at $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$out"
          emit DB_PASSWORD "$DB_PASSWORD" required
          emit DB_NAME "$DB_NAME"
          emit DB_USER "$DB_USER"
          emit DB_HOST "$DB_HOST"
          emit DB_PORT "$DB_PORT"
          emit NEXTAUTH_SECRET "$NEXTAUTH_SECRET" required
          emit NEXTAUTH_URL "$NEXTAUTH_URL" required
          emit DISCORD_CLIENT_ID "$DISCORD_CLIENT_ID" required
          emit DISCORD_CLIENT_SECRET "$DISCORD_CLIENT_SECRET" required
          emit GITHUB_CLIENT_ID "$GH_OAUTH_CLIENT_ID"
          emit GITHUB_CLIENT_SECRET "$GH_OAUTH_CLIENT_SECRET"
          emit GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
          emit GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
          emit SUPER_ADMIN_EMAILS "$SUPER_ADMIN_EMAILS"
          emit CRON_SECRET "$CRON_SECRET"
          emit RBAC_READ_POLICY "$RBAC_READ_POLICY"
          emit NEXT_SERVER_ACTIONS_ENCRYPTION_KEY "$NEXT_SERVER_ACTIONS_ENCRYPTION_KEY"
          # IMAGE_TAG is added by scripts/deploy.sh on the server
          chmod 600 "$out"

          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET is not set; cron endpoints will be unusable."
          fi
          if [ -z "$NEXT_SERVER_ACTIONS_ENCRYPTION_KEY" ]; then
            echo "::warning::NEXT_SERVER_ACTIONS_ENCRYPTION_KEY is not set; server action IDs change on every build."
          fi

      - name: Upload files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          source: "docker-compose.yml,scripts/,deploy.env"
          target: "/tmp/bingoscape-deploy/"
          rm: true
          overwrite: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          envs: IMAGE_TAG,REGISTRY_USER,REGISTRY_TOKEN
          command_timeout: 20m
          script: bash /tmp/bingoscape-deploy/scripts/deploy.sh
