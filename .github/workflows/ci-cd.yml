name: CI/CD

# Pull requests: lint, typecheck, tests and a non-pushing image build.
# Push to main: the same checks, then publish the images as :main and :sha-<short>.
# Tag v*.*.*: the same checks, then publish semver tags and :latest.
# Deploys are manual (see deploy.yml) and pick one of these tags.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SKIP_ENV_VALIDATION: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # Tests start a throwaway PostgreSQL container via testcontainers,
      # which works out of the box on ubuntu-latest runners.
      - name: Unit and integration tests
        run: npm test

      - name: Validate docker-compose.yml
        run: docker compose config -q

  build:
    name: Build ${{ matrix.target }} image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      matrix:
        include:
          # Both images get identical tag sets, so one IMAGE_TAG selects both.
          - target: runner
            suffix: ""
            title: Bingoscape Next
            attest: true
          - target: migrator
            suffix: "-migrator"
            title: Bingoscape Next Migrator
            attest: false
    env:
      IMAGE: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Not for pull requests from forks: they get a read-only token
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name != 'pull_request' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=OSRS clan bingo management platform
            org.opencontainers.image.vendor=Bingoscape

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ env.PUBLISH == 'true' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}

      - name: Generate build provenance attestation
        if: env.PUBLISH == 'true' && matrix.attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
