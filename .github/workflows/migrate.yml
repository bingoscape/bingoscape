name: Database Migration

# Manual database migration without a deploy (the deploy workflow already runs
# migrations before it starts the new app). Uses the migrator image of the same
# tag, so pick the tag you are about to deploy.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag of the migrator to run: main, sha-<short> or a release tag such as v1.2.3"
        required: true
        default: "main"
        type: string
      confirm:
        description: 'Type "MIGRATE" to confirm running migrations'
        required: true
        type: string

# Share the lock with the deploy workflow so the two never touch the database at once
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ inputs.confirm == 'MIGRATE' }}
    environment: production

    steps:
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid image_tag. Allowed: letters, digits, '_', '.', '-' (max 128 chars)."
            exit 1
          fi

      - name: Run migrations on server
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          envs: IMAGE_TAG,REGISTRY_USER,REGISTRY_TOKEN
          command_timeout: 15m
          script: |
            set -eu

            cd ~/bingoscape
            [ -f docker-compose.yml ] || { echo "docker-compose.yml not found in ~/bingoscape"; exit 1; }
            [ -f .env ] || { echo ".env not found in ~/bingoscape"; exit 1; }

            # IMAGE_TAG from the environment takes precedence over the one in .env
            export IMAGE_TAG

            trap 'docker logout ghcr.io > /dev/null 2>&1 || true' EXIT
            printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin > /dev/null
            docker compose pull migrate
            docker logout ghcr.io > /dev/null 2>&1 || true

            if docker ps --format '{{.Names}}' | grep -qx 'bingoscape-postgres'; then
              bash ./scripts/backup-db.sh pre-deploy "migrate-${IMAGE_TAG}"
            else
              echo "PostgreSQL container is not running, skipping backup"
            fi

            docker compose up -d --wait --wait-timeout 120 postgres
            docker compose run --rm -T migrate
